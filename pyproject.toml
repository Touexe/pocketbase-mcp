[project]
name = "pocketbase-mcp"
version = "0.1.0"
description = "MCP server exposing PocketBase through 13 intent-first tools."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3,<4",
    "pydantic>=2",
    "pydantic-settings>=2",
    "result>=0.17.0",
    "pypocketbase",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

[tool.uv.sources]
pypocketbase = { git = "https://github.com/Touexe/pypocketbase" }

[project.scripts]
pocketbase-mcp = "pocketbase_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketbase_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: integration tests that run against a real PocketBase server (deselected by default; run with `pytest -m live`)",
]
